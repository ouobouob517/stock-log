<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>持股記錄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="持股">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafaf8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1c1c1a;--mu:#8a8a85;--ln:#ececE8;--ac:#1c1c1a;--ac-tx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1d1d1b;--tx:#eeeeea;--mu:#8d8d87;--ln:#2a2a27;--ac:#eeeeea;--ac-tx:#141413}}
:root[data-theme="dark"]{--bg:#141413;--card:#1d1d1b;--tx:#eeeeea;--mu:#8d8d87;--ln:#2a2a27;--ac:#eeeeea;--ac-tx:#141413}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--mu);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-size:17px;font-weight:600}
.meta{color:var(--mu);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;padding:12px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.stats div span{display:block;color:var(--mu);font-size:12px}
.stats div b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.lot{display:grid;grid-template-columns:48px 1fr 1fr 28px;gap:6px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.lot .mu{color:var(--mu)}
.r{text-align:right}
button{font:inherit;cursor:pointer;border:none;background:none;color:var(--mu);padding:4px 6px;border-radius:8px}
button:hover{color:var(--tx)}
.btn{background:var(--ac);color:var(--ac-tx);padding:9px 16px;border-radius:10px;font-size:14px}
.btn:hover{color:var(--ac-tx);opacity:.88}
.ghost{border:1px dashed var(--ln);width:100%;padding:12px;border-radius:12px;color:var(--mu)}
form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0;flex:1 1 90px}
input:focus,select:focus{outline:none;border-color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.total{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin:0 2px 14px}
</style>
</head>
<body>
<main>
  <h1>持股記錄</h1>
  <div class="sub" id="sub"></div>
  <div id="list"></div>
  <div id="addbox"></div>
  <div style="text-align:center;margin-top:26px;font-size:13px">
    <button onclick="doExport()">備份（複製）</button> · <button onclick="doImport()">還原（貼上）</button>
  </div>
</main>
<script>
const KEY='stocklog.v1';
const seed=[{id:1,code:'5289',name:'宜鼎',year:'115',div:'年配',lots:[
 {id:11,date:'0828',price:1480,qty:20},{id:12,date:'0903',price:1415,qty:20}]}];
let data=load(), openLot=null, showAdd=false;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return seed}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const fmt2=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const uid=()=>Date.now()+Math.floor(Math.random()*1000);

function render(){
  let all=0;
  document.getElementById('list').innerHTML=data.length?data.map(s=>{
    const qty=s.lots.reduce((a,l)=>a+l.qty,0), cost=s.lots.reduce((a,l)=>a+l.qty*l.price,0);
    all+=cost;
    return `<div class="card">
      <div class="top"><div><div class="name">${esc(s.code)} ${esc(s.name)}</div>
      <div class="meta">${esc(s.year)} 年 · ${esc(s.div)}</div></div>
      <button onclick="delStock(${s.id})" title="刪除股票">刪除</button></div>
      <div class="stats">
        <div><span>股數</span><b>${fmt(qty)}</b></div>
        <div><span>均價</span><b>${qty?fmt2(cost/qty):'-'}</b></div>
        <div><span>總成本</span><b>${fmt(cost)}</b></div>
      </div>
      ${s.lots.map(l=>`<div class="lot"><span class="mu">${esc(l.date)}</span>
        <span>${fmt2(l.price)}</span><span class="r">${fmt(l.qty)} 股</span>
        <button onclick="delLot(${s.id},${l.id})" title="刪除">×</button></div>`).join('')}
      ${openLot===s.id?`<form onsubmit="return addLot(event,${s.id})">
        <input name="date" placeholder="日期 0828" inputmode="numeric" maxlength="4" required>
        <input name="price" placeholder="價格" inputmode="decimal" required>
        <input name="qty" placeholder="股數" inputmode="numeric" required>
        <button class="btn">加入</button></form>`
      :`<button onclick="openLot=${s.id};render()" style="margin-top:6px">+ 新增買進</button>`}
    </div>`}).join(''):'<div class="empty">還沒有記錄</div>';
  document.getElementById('sub').textContent=data.length?`共 ${data.length} 檔 · 總成本 ${fmt(all)}`:'';
  document.getElementById('addbox').innerHTML=showAdd?`<div class="card"><form onsubmit="return addStock(event)" style="margin:0">
    <input name="code" placeholder="股票號碼" inputmode="numeric" required>
    <input name="name" placeholder="公司" required>
    <input name="year" placeholder="年度 115" inputmode="numeric" required>
    <select name="div"><option>年配</option><option>半年配</option><option>季配</option><option>月配</option><option>不配息</option></select>
    <input name="date" placeholder="日期 0828" inputmode="numeric" maxlength="4" required>
    <input name="price" placeholder="價格" inputmode="decimal" required>
    <input name="qty" placeholder="股數" inputmode="numeric" required>
    <button class="btn">新增</button><button type="button" onclick="showAdd=false;render()">取消</button></form></div>`
    :`<button class="ghost" onclick="showAdd=true;render()">+ 新增股票</button>`;
}
function addLot(e,id){e.preventDefault();const f=new FormData(e.target);
  data.find(s=>s.id===id).lots.push({id:uid(),date:f.get('date'),price:+f.get('price'),qty:+f.get('qty')});
  openLot=null;save();render();return false}
function addStock(e){e.preventDefault();const f=new FormData(e.target);
  data.push({id:uid(),code:f.get('code'),name:f.get('name'),year:f.get('year'),div:f.get('div'),
  lots:[{id:uid(),date:f.get('date'),price:+f.get('price'),qty:+f.get('qty')}]});
  showAdd=false;save();render();return false}
function delLot(sid,lid){if(!confirm('刪除這筆買進？'))return;const s=data.find(x=>x.id===sid);s.lots=s.lots.filter(l=>l.id!==lid);save();render()}
function delStock(id){if(!confirm('刪除這檔股票與全部記錄？'))return;data=data.filter(s=>s.id!==id);save();render()}
async function doExport(){const t=JSON.stringify(data);
  try{await navigator.clipboard.writeText(t);alert('已複製備份文字，可貼到備忘錄保存')}
  catch(e){prompt('請全選複製這段備份文字：',t)}}
function doImport(){const t=prompt('貼上備份文字（會覆蓋目前資料）：');if(!t)return;
  try{const d=JSON.parse(t);if(!Array.isArray(d))throw 0;data=d;save();render()}catch(e){alert('格式不正確')}}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
