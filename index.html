<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>持股記錄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="持股">
<meta name="theme-color" content="#fafaf8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1c1c1a;--mu:#8a8a85;--ln:#ececE8;--ac:#1c1c1a;--at:#fff;--up:#d6403f;--dn:#1f9d55;--al:#fff4e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1d1d1b;--tx:#eeeeea;--mu:#8d8d87;--ln:#2a2a27;--ac:#eeeeea;--at:#141413;--up:#ff6b6b;--dn:#3ddc84;--al:#3a2f18}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 60px}
.bar,.tabs{display:flex;gap:4px;align-items:center;margin-bottom:10px}
.bar select{flex:1;font-weight:600;font-size:17px;border:none;background:none;padding:4px 0}
.tabs button{padding:6px 14px;border-radius:99px;color:var(--mu)}
.tabs button.on,.chip.on{background:var(--ac);color:var(--at)}
#chips{display:flex;margin-bottom:10px}#chips select{flex:1}
.chip{border:1px solid var(--ln);border-radius:99px;padding:3px 12px;font-size:13px}
.al{background:var(--al);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px}
.sub{color:var(--mu);font-size:13px;margin:6px 2px 14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;gap:8px}
.name{font-size:17px;font-weight:600}.px{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.meta{color:var(--mu);font-size:13px}.lim{margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin:12px 0;padding:12px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.stats span{display:block;color:var(--mu);font-size:12px}.stats b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.lot{display:grid;grid-template-columns:42px 1fr 1fr 1fr 26px;gap:4px;align-items:center;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.r{text-align:right}.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.3fr;gap:4px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px;font-variant-numeric:tabular-nums}
.row.h{color:var(--mu);font-size:12px}.row small{display:block;font-size:11px}
h3{font-size:14px;margin:18px 0 4px;color:var(--mu);font-weight:500}
button{font:inherit;cursor:pointer;border:none;background:none;color:var(--mu);padding:4px 6px;border-radius:8px}
button:hover{color:var(--tx)}
.btn{background:var(--ac);color:var(--at);padding:9px 16px;border-radius:10px;font-size:14px}.btn:hover{color:var(--at);opacity:.88}
.ghost{border:1px dashed var(--ln);width:100%;padding:12px;border-radius:12px}
form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0;flex:1 1 90px}
.bar select{border:none}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:8px;border-top:1px solid var(--ln)}
.fs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:center;margin-top:6px;font-size:14px}.fs input{width:100%;flex:none;padding:6px 8px}
.empty{color:var(--mu);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main>
<div class="bar"><select id="u" onchange="db.cur=+this.value;bf='';save();render()"></select>
<button onclick="addU()">＋</button><button onclick="renU()">改名</button><button onclick="delU()">刪除</button></div>
<div id="chips"></div>
<input id="q" type="search" placeholder="搜尋持股：代號或名稱（如 0050、元大台灣50）" autocomplete="off" oninput="q=this.value;render()" style="width:100%;margin-bottom:10px">
<div class="tabs"><button id="t0" onclick="tab=0;render()">持股</button><button id="t1" onclick="tab=1;render()">分析</button><button id="t2" onclick="tab=2;render()">追蹤</button>
<button onclick="setProxy()" style="margin-left:auto">⚙</button><button onclick="askNote()">🔔</button><button onclick="refresh()">↻ 股價</button></div>
<div class="meta" id="st" style="margin:-4px 0 10px"></div>
<div id="wbox" class="card" style="display:none"><input id="wq" placeholder="搜尋還沒買的股票：代號或名稱（如 2330、台積電）" oninput="wSearch(this.value)" autocomplete="off" style="width:100%"><div id="wres"></div>
<div class="meta" style="margin-top:8px">找不到時：<button onclick="addWM()">手動輸入代號加入</button></div></div>
<div id="alerts"></div><div id="view"></div>
<datalist id="bl"></datalist>
<div style="text-align:center;margin-top:26px;font-size:13px">
<button onclick="doExport()">備份（複製）</button> · <button onclick="doImport()">還原（貼上）</button></div>
</main>
<script>
const K='stocklog.v2',BR=['國泰','華南','元大','富邦','凱基','永豐','玉山'];
const seed=()=>({cur:1,fee:{on:0,d:6},px:{},at:0,users:[{id:1,name:'我',stocks:[{id:1,code:'5289',name:'宜鼎',year:'115',div:'年配',sell:0,stop:0,low:0,man:0,lots:[{id:11,date:'0828',price:1480,qty:20,br:''},{id:12,date:'0903',price:1415,qty:20,br:''}]}]}]});
const fixS=a=>a.map(x=>({sell:0,stop:0,low:0,man:0,...x,lots:x.lots.map(l=>({br:'',...l}))}));
function load(){try{let s=localStorage.getItem(K);if(s)return JSON.parse(s);s=localStorage.getItem('stocklog.v1');
 if(s){const o=seed();o.users[0].stocks=fixS(JSON.parse(s));return o}}catch(e){}return seed()}
let q='',WR=[],wt,sy,lastSync='',db=load(),tab=0,bf='',BSL=[],openLot=null,showAdd=false,lastBr='';
const $=id=>document.getElementById(id),U=()=>db.users.find(u=>u.id===db.cur)||db.users[0];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}clearTimeout(sy);sy=setTimeout(()=>syncAlerts(),1500)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('en-US'),f2=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const sg=n=>(n>0?'+':'')+fmt(n),sp=n=>(n>0?'+':'')+n.toFixed(2)+'%',cl=n=>n>0?'up':n<0?'dn':'';
const uid=()=>Date.now()+Math.floor(Math.random()*1e3),match=s=>{const k=q.trim().toLowerCase();return !k||(s.code+s.name).toLowerCase().includes(k)},lb=l=>l.br||'未指定',fl=s=>bf?s.lots.filter(l=>lb(l)===bf):s.lots;
const chg=s=>{const x=db.px[s.code];if(!x||!x.y||s.man>0)return'';const d=price(s)-x.y;return `<div class="meta ${cl(d)}">${d>0?'+':''}${f2(d)} (${sp(d/x.y*100)})</div>`};
const price=s=>s.man>0?s.man:(db.px[s.code]?.p||0);
const fx=b=>{const o=(db.brk||{})[b]||{};return{d:o.d??db.fee.d,m:o.m??20,mo:o.mo??1}};
function calc(L,code,p){const qty=L.reduce((a,l)=>a+l.qty,0),cost=L.reduce((a,l)=>a+l.qty*l.price,0),mv=qty*p;let pl=mv-cost,bc=0;
 if(db.fee.on&&p>0){const t=code.startsWith('00')?.001:.003,g={};
  L.forEach(l=>{const b=lb(l),f=fx(b),o=g[b]=g[b]||{q:0,f};o.q+=l.qty;bc+=Math.max(Math.floor(l.price*l.qty*.001425*f.d/10),l.qty<1000?f.mo:f.m)});
  let sf=0;for(const b in g){const o=g[b],sv=o.q*p;sf+=Math.max(Math.floor(sv*.001425*o.f.d/10),o.q<1000?o.f.mo:o.f.m)+Math.floor(sv*t)}
  pl=mv-cost-bc-sf}
 const base=cost+bc;return{qty,cost,bc,mv,pl,pct:base?pl/base*100:0,has:p>0}}
const add=(T,c)=>{T.cost+=c.cost;if(c.has){T.mv+=c.mv;T.pl+=c.pl;T.pc+=c.cost+c.bc}};
const lotForm=(sid,extra)=>`<input name="date" placeholder="日期 0828" inputmode="numeric" maxlength="4" required>
<input name="price" placeholder="價格" inputmode="decimal" required><input name="qty" placeholder="股數" inputmode="numeric" required>
<input name="br" list="bl" placeholder="券商" value="${esc(lastBr)}">`;

function alerts(u){const r=[];u.stocks.forEach(s=>{const p=price(s);if(!p)return;const k=t=>s.id+':'+t;
 if(s.sell>0&&p>=s.sell)r.push([k('s'+s.sell),`🔔 ${esc(s.name)} 現價 ${f2(p)} 已達賣出限價 ${f2(s.sell)}`]);
 if(s.stop>0&&p<=s.stop)r.push([k('x'+s.stop),`⚠️ ${esc(s.name)} 現價 ${f2(p)} 已跌破停損價 ${f2(s.stop)}`]);
 if(s.low>0&&p<=s.low)r.push([k('l'+s.low),`📉 ${esc(s.name)} 現價 ${f2(p)} 已跌到低點提醒價 ${f2(s.low)}`])});
 (u.watch||[]).forEach(w=>{const p=price(w);if(p&&w.low>0&&p<=w.low)r.push(['w'+w.id+':'+w.low,`👀 追蹤：${esc(w.name)} 現價 ${f2(p)} 已跌到提醒價 ${f2(w.low)}`])});return r}
function notify(list){if(!('Notification' in window)||Notification.permission!=='granted')return;db.nt=db.nt||{};const d=new Date().toDateString();let ch=0;
 list.forEach(([k,t])=>{if(db.nt[k]===d)return;db.nt[k]=d;ch=1;
  const o={body:t,icon:'./icon-192.png'};
  (navigator.serviceWorker?navigator.serviceWorker.ready.then(r=>r.showNotification('持股提醒',o)):Promise.reject()).catch(()=>{try{new Notification('持股提醒',o)}catch(e){}})});
 if(ch)save()}
function askNote(){if(!('Notification' in window))return alert('這個瀏覽器不支援通知');
 Notification.requestPermission().then(p=>alert(p==='granted'?'已開啟：app 開著時，到價會跳出通知（同一提醒每天一次）':'未允許通知，請到手機設定開啟'))}
function render(){
 const u=U();db.cur=u.id;
 $('u').innerHTML=db.users.map(x=>`<option value="${x.id}"${x.id===u.id?' selected':''}>${esc(x.name)}</option>`).join('');
 $('t0').className=tab==0?'on':'';$('t1').className=tab==1?'on':'';$('t2').className=tab==2?'on':'';$('wbox').style.display=tab==2?'':'none';$('chips').style.display=$('q').style.display=tab==2?'none':'';
 const bs=[...new Set(u.stocks.flatMap(s=>s.lots.map(lb)))];
 if(bf&&!bs.includes(bf))bf='';BSL=['',...bs];
 $('chips').innerHTML=`<select onchange="bf=BSL[this.value];render()">${BSL.map((b,i)=>`<option value="${i}"${b===bf?' selected':''}>${b?esc(b):'所有券商'}</option>`).join('')}</select>`;
 $('bl').innerHTML=[...new Set([...BR,...bs.filter(x=>x!=='未指定')])].map(b=>`<option value="${esc(b)}">`).join('');
 $('st').textContent=db.at?'股價更新 '+new Date(db.at).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'（'+(db.live?'最新':'最近收盤價')+'）':'尚未更新股價';
 $('alerts').innerHTML=alerts(u).map(a=>`<div class="al">${a[1]}</div>`).join('');notify(db.users.flatMap(alerts));
 $('view').innerHTML=tab==2?watchView(u):tab?ana(u):hold(u);
}
function hold(u){
 let tc=0,tp=0,n=0,pc=0;
 const cards=u.stocks.map(s=>{const L=fl(s);if(!L.length||!match(s))return'';n++;const p=price(s),c=calc(L,s.code,p);tc+=c.cost;if(c.has){tp+=c.pl;pc+=c.cost+c.bc}
  return `<div class="card"><div class="top"><div><div class="name">${esc(s.code)} ${esc(s.name)}</div><div class="meta">${esc(s.year)} 年 · ${esc(s.div)}</div></div>
  <div class="r"><div class="px">${p?f2(p):'--'}</div><div class="meta">${chg(s)}${s.man>0?'手動':(db.px[s.code]?.rt?'最新':'收盤')}<button onclick="setPx(${s.id})">改</button></div></div></div>
  <div class="meta lim">賣出限價 ${s.sell>0?f2(s.sell):'未設'} · 停損 ${s.stop>0?f2(s.stop):'未設'} · 低點 ${s.low>0?f2(s.low):'未設'}<button onclick="setLim(${s.id})">設定</button></div>
  <div class="stats"><div><span>股數</span><b>${fmt(c.qty)}</b></div><div><span>均價</span><b>${c.qty?f2(c.cost/c.qty):'-'}</b></div><div><span>成本</span><b>${fmt(c.cost)}</b></div>
  <div><span>市值</span><b>${c.has?fmt(c.mv):'-'}</b></div><div><span>損益</span><b class="${cl(c.pl)}">${c.has?sg(c.pl):'-'}</b></div><div><span>報酬</span><b class="${cl(c.pl)}">${c.has?sp(c.pct):'-'}</b></div></div>
  ${L.map(l=>`<div class="lot"><span class="mu">${esc(l.date)}</span><span class="mu">${esc(lb(l))}</span><span>${f2(l.price)}</span><span class="r">${fmt(l.qty)} 股</span><button onclick="delLot(${s.id},${l.id})">×</button></div>`).join('')}
  ${openLot===s.id?`<form onsubmit="return addLot(event,${s.id})">${lotForm()}<button class="btn">加入</button></form>`:''}
  <div class="foot">${openLot===s.id?'<span></span>':`<button onclick="openLot=${s.id};render()">+ 新增買進</button>`}<button onclick="delStock(${s.id})">刪除股票</button></div></div>`}).join('');
 const sub=n?`<div class="sub">共 ${n} 檔 · 成本 ${fmt(tc)} · 損益 <span class="${cl(tp)}">${pc?sg(tp)+'（'+sp(tp/pc*100)+'）':'-'}</span></div>`:'';
 return sub+(cards||`<div class="empty">${q.trim()?'找不到符合的持股':'還沒有記錄'}</div>`)+(showAdd?`<div class="card"><form onsubmit="return addStock(event)" style="margin:0">
  <input name="code" placeholder="股票代號（如 00403A）" autocapitalize="characters" autocomplete="off" required><input name="name" placeholder="公司" required>
  <input name="year" placeholder="年度 115" inputmode="numeric" required><select name="div"><option>年配</option><option>半年配</option><option>季配</option><option>月配</option><option>不配息</option></select>
  ${lotForm()}<button class="btn">新增</button><button type="button" onclick="showAdd=false;render()">取消</button></form></div>`
  :`<button class="ghost" onclick="showAdd=true;render()">+ 新增股票</button>`);
}
function ana(u){
 const T={cost:0,mv:0,pl:0,pc:0},byB={},rows=[];
 u.stocks.forEach(s=>{const L=fl(s);if(!L.length||!match(s))return;const p=price(s),c=calc(L,s.code,p);add(T,c);rows.push([s.name,{...c,pc:c.has?c.cost+c.bc:0,pl:c.has?c.pl:0}]);
  const g={};L.forEach(l=>(g[lb(l)]=g[lb(l)]||[]).push(l));
  for(const b in g){byB[b]=byB[b]||{cost:0,mv:0,pl:0,pc:0};add(byB[b],calc(g[b],s.code,p))}});
 const row=(n,x)=>`<div class="row"><span>${esc(n)}</span><span class="r">${fmt(x.cost)}</span><span class="r">${x.mv?fmt(x.mv):'-'}</span><span class="r ${cl(x.pl)}">${x.pc?sg(x.pl)+'<small>'+sp(x.pl/x.pc*100)+'</small>':'-'}</span></div>`;
 const hd='<div class="row h"><span></span><span class="r">成本</span><span class="r">市值</span><span class="r">損益</span></div>';
 return `<div class="card"><div class="meta">總損益${db.fee.on?'（已扣預估費用）':''}</div>
  <div class="px ${cl(T.pl)}" style="font-size:28px">${T.pc?sg(T.pl):'-'}</div><div class="meta ${cl(T.pl)}">${T.pc?sp(T.pl/T.pc*100):''}</div>
  <div class="stats" style="grid-template-columns:1fr 1fr;border-bottom:none;margin-bottom:0"><div><span>總成本</span><b>${fmt(T.cost)}</b></div><div><span>總市值</span><b>${T.mv?fmt(T.mv):'-'}</b></div></div></div>
  <h3>依股票</h3>${hd}${rows.map(r=>row(r[0],r[1])).join('')||'<div class="empty">無資料</div>'}
  <h3>依券商</h3>${hd}${Object.keys(byB).map(b=>row(b,byB[b])).join('')}
  <h3>手續費設定</h3><label style="font-size:14px;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" style="flex:none;width:auto" ${db.fee.on?'checked':''} onchange="db.fee.on=this.checked?1:0;save();render()"><span>損益改用「扣除手續費與證交稅」的預估值（依下方各券商設定計算）</span></label>
  <div class="fs meta" style="margin-top:10px"><span>券商</span><span>折數</span><span>整股低消</span><span>零股低消</span></div>
  <div class="fs"><span>預設</span><input type="number" step="0.1" min="0.1" max="10" value="${db.fee.d}" onchange="db.fee.d=+this.value||10;save();render()"><span class="meta">未單獨設定者</span><span></span></div>
  ${BSL.slice(1).map((b,i)=>{const o=(db.brk||{})[b]||{};return `<div class="fs"><span>${esc(b)}</span>
   <input type="number" step="0.1" placeholder="${db.fee.d}" value="${o.d??''}" onchange="setB(${i},'d',this.value)">
   <input type="number" placeholder="20" value="${o.m??''}" onchange="setB(${i},'m',this.value)">
   <input type="number" placeholder="1" value="${o.mo??''}" onchange="setB(${i},'mo',this.value)"></div>`}).join('')}
  <div class="sub">折數填 6 = 六折；留空 = 用預設。賣出證交稅：股票 0.3%、ETF（00 開頭）0.1%。手續費與稅金逐筆無條件捨去，並套用最低手續費（整股 1,000 股以上用整股低消，不足用零股低消）。</div>
  <div class="sub">股價：設定 ⚙ 中繼站後盤中自動更新，否則為最近收盤價；不含股利。</div>`;
}
function addLot(e,id){e.preventDefault();const f=new FormData(e.target);lastBr=f.get('br').trim();
 U().stocks.find(s=>s.id===id).lots.push({id:uid(),date:f.get('date'),price:+f.get('price'),qty:+f.get('qty'),br:lastBr});openLot=null;save();render();return false}
function addStock(e){e.preventDefault();const f=new FormData(e.target);lastBr=f.get('br').trim();
 U().stocks.push({id:uid(),code:f.get('code').trim().toUpperCase(),name:f.get('name'),year:f.get('year'),div:f.get('div'),sell:0,stop:0,low:0,man:0,
 lots:[{id:uid(),date:f.get('date'),price:+f.get('price'),qty:+f.get('qty'),br:lastBr}]});showAdd=false;save();render();refresh();return false}
const gs=id=>U().stocks.find(s=>s.id===id);
function delLot(sid,lid){if(!confirm('刪除這筆買進？'))return;const s=gs(sid);s.lots=s.lots.filter(l=>l.id!==lid);save();render()}
function delStock(id){if(!confirm('刪除這檔股票與全部記錄？'))return;U().stocks=U().stocks.filter(s=>s.id!==id);save();render()}
function setPx(id){const s=gs(id),v=prompt('輸入現價（0 = 改回自動收盤價）',s.man||price(s));if(v===null)return;s.man=+v||0;save();render()}
function setLim(id){const s=gs(id),q=(t,v)=>prompt(t+'（0 = 不設）',v||0);
 const a=q('賣出限價（漲到提醒）',s.sell);if(a===null)return;const b=q('停損價（跌破提醒）',s.stop);if(b===null)return;
 const c=q('低點提醒價（跌到提醒，可作加碼參考）',s.low);if(c===null)return;s.sell=+a||0;s.stop=+b||0;s.low=+c||0;save();render()}
function addU(){const n=prompt('新使用者名稱');if(!n)return;const id=uid();db.users.push({id,name:n,stocks:[]});db.cur=id;bf='';save();render()}
function renU(){const n=prompt('改名',U().name);if(!n)return;U().name=n;save();render()}
function delU(){if(db.users.length<2)return alert('至少要保留一位使用者');if(!confirm('刪除「'+U().name+'」與其全部記錄？'))return;
 db.users=db.users.filter(x=>x.id!==db.cur);db.cur=db.users[0].id;bf='';save();render()}
async function refresh(){
 const codes=new Set(db.users.flatMap(u=>[...u.stocks,...(u.watch||[])].map(s=>s.code)));$('st').textContent='更新中…';let ok=0;
 if(db.proxy){try{const j=await (await fetch(db.proxy+(db.proxy.includes('?')?'&':'?')+'codes='+[...codes].join(','),{cache:'no-store'})).json();
  let rt=0;for(const c in j){db.px[c]={p:j[c].p,y:j[c].y,rt:j[c].rt};if(j[c].rt)rt++}
  db.at=Date.now();db.live=rt>0;save();render();const ms=[...codes].filter(c=>!j[c]);
  if(ms.length)$('st').textContent+=' · 查無股價：'+ms.join('、');return}
  catch(e){render();$('st').textContent='中繼站連線失敗（'+(e.message||e)+'），請檢查 ⚙ 網址';return}}
 const put=(c,v)=>{const p=parseFloat(String(v).replace(/,/g,''));if(codes.has(c)&&p>0)db.px[c]={p}};
 const g=async(n,url,f)=>{try{const a=await (await fetch(url,{cache:'no-store'})).json();a.forEach(f);ok++;return n+' ✓'}catch(e){return n+' ✗（'+(e.message||e)+'）'}};
 const res=await Promise.all([g('證交所','https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',x=>put(x.Code,x.ClosingPrice)),
  g('櫃買','https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',x=>put(x.SecuritiesCompanyCode,x.Close))]);
 if(ok)db.at=Date.now();save();render();
 const miss=[...codes].filter(c=>!db.px[c]);
 if(res.some(r=>r.includes('✗'))||miss.length)$('st').textContent=res.join(' · ')+(miss.length?' · 查無股價：'+miss.join('、'):'')+'；可點「改」手動輸入'}
const mkt=()=>{const t=new Date(Date.now()+(new Date().getTimezoneOffset()+480)*6e4),m=t.getHours()*60+t.getMinutes(),d=t.getDay();return d>0&&d<6&&m>=540&&m<=810};
const stale=()=>Date.now()-db.at>(db.proxy&&mkt()?55e3:18e5);
function setB(i,k,v){const b=BSL[i+1];db.brk=db.brk||{};const o=db.brk[b]=db.brk[b]||{},n=parseFloat(v);if(v===''||isNaN(n))delete o[k];else o[k]=n;save();render()}
function watchView(u){u.watch=u.watch||[];
 return u.watch.map(w=>{const p=price(w),d=p&&w.low>0?(p-w.low)/w.low*100:null;
  return `<div class="card"><div class="top"><div><div class="name">${esc(w.code)} ${esc(w.name)}</div>
  <div class="meta">${w.low>0?'跌到 '+f2(w.low)+' 提醒':'未設提醒價'}${d!==null?' · 距離 '+(d>0?'+':'')+d.toFixed(1)+'%':''}</div></div>
  <div class="r"><div class="px">${p?f2(p):'--'}</div>${chg(w)}</div></div>
  <div class="foot"><button onclick="setW(${w.id})">設定提醒價</button><button onclick="delW(${w.id})">取消追蹤</button></div></div>`}).join('')||'<div class="empty">還沒有追蹤的股票<br>用上方搜尋框加入</div>'}
function wSearch(v){clearTimeout(wt);const r=$('wres');v=v.trim();if(!v){r.innerHTML='';return}
 if(!db.proxy){r.innerHTML='<div class="meta" style="margin-top:8px">需先在 ⚙ 設定價格中繼站才能搜尋，或用下方手動輸入代號</div>';return}
 r.innerHTML='<div class="meta" style="margin-top:8px">搜尋中…</div>';
 wt=setTimeout(async()=>{try{const a=await (await fetch(db.proxy+(db.proxy.includes('?')?'&':'?')+'q='+encodeURIComponent(v))).json();WR=a;
  r.innerHTML=a.length?a.map((x,i)=>`<div class="lot" style="grid-template-columns:72px 1fr auto"><span>${esc(x.code)}</span><span>${esc(x.name)}</span><button onclick="addW(${i})">＋ 追蹤</button></div>`).join(''):'<div class="meta" style="margin-top:8px">找不到符合的股票，可用下方手動輸入</div>'}
  catch(e){r.innerHTML='<div class="meta" style="margin-top:8px">搜尋失敗，請確認 Worker 已更新為新版</div>'}},350)}
function addW(i){const x=WR[i];if(x)addWatch(x.code,x.name)}
function addWM(){const c=prompt('股票代號（如 2330、00403A）');if(!c)return;addWatch(c.trim().toUpperCase(),prompt('名稱（可留空）')||c.trim().toUpperCase())}
function addWatch(code,name){const u=U();u.watch=u.watch||[];if(u.watch.some(w=>w.code===code))return alert('已在追蹤清單');
 const w={id:uid(),code,name,low:0};u.watch.push(w);$('wq').value='';$('wres').innerHTML='';save();render();refresh();setW(w.id)}
function setW(id){const w=U().watch.find(x=>x.id===id),v=prompt('跌到多少時提醒？（0 = 不設）',w.low||0);if(v===null)return;w.low=+v||0;save();render()}
function delW(id){if(!confirm('取消追蹤？'))return;U().watch=U().watch.filter(x=>x.id!==id);save();render()}
function buildCfg(){const a=[];db.users.forEach(u=>{u.stocks.forEach(s=>{if(s.sell>0||s.stop>0||s.low>0)a.push({k:u.id+':'+s.id,u:u.name,code:s.code,name:s.name,sell:s.sell,stop:s.stop,low:s.low})});
 (u.watch||[]).forEach(w=>{if(w.low>0)a.push({k:u.id+':w'+w.id,u:u.name,code:w.code,name:w.name,low:w.low,w:1})})});return a}
async function syncAlerts(force,test){if(!db.proxy||!db.key)return{ok:false,msg:'未設定'};
 const cfg=buildCfg(),body=JSON.stringify(cfg);if(!force&&body===lastSync)return{ok:true,n:cfg.length};
 try{const u=new URL(db.proxy);u.searchParams.set('sync','1');u.searchParams.set('key',db.key);if(test)u.searchParams.set('test','1');
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body}),j=await r.json();
  if(!r.ok||!j.ok)return{ok:false,msg:j.error||r.status};lastSync=body;return{ok:true,n:cfg.length,tg:j.tg}}
 catch(e){return{ok:false,msg:e.message||String(e)}}}
async function setProxy(){const v=prompt('價格中繼站網址（Cloudflare Worker；留空 = 不使用）',db.proxy||'');if(v===null)return;db.proxy=v.trim();
 if(db.proxy){const k=prompt('Telegram 推播密碼（與 Worker 的 KEY 相同；不用推播請留空）',db.key||'');if(k!==null)db.key=k.trim()}
 save();refresh();
 if(db.proxy&&db.key){const r=await syncAlerts(true,true);alert(r.ok?'已同步 '+r.n+' 筆提醒'+(r.tg==='ok'?'，Telegram 測試訊息已送出':'，但 Telegram 發送失敗：'+r.tg):'同步失敗：'+r.msg)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&stale())refresh()});setInterval(()=>{if(stale())refresh()},6e4);
async function doExport(){const t=JSON.stringify(db);try{await navigator.clipboard.writeText(t);alert('已複製備份文字，可貼到備忘錄保存')}catch(e){prompt('請全選複製：',t)}}
function doImport(){const t=prompt('貼上備份文字（會覆蓋目前資料）：');if(!t)return;
 try{const d=JSON.parse(t);if(Array.isArray(d)){U().stocks=fixS(d)}else if(d.users){db=d}else throw 0;save();render()}catch(e){alert('格式不正確')}}
render();if(stale())refresh();syncAlerts();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
